{# Code version: v1.8.3-codex.2 #}
{% set cache_source_keys = cache_sources | map(attribute="key") | list %}
{% set llm_cache_source_keys = llm_cache_sources | map(attribute="key") | list %}
<nav class="sidebar-dock" aria-label="Workspace sections">
    <a
        href="{{ url_for('agent') }}"
        class="sidebar-dock-item{% if dock_section == 'agent' %} is-active{% endif %}"
        data-dock-section="agent"
        data-section-link="agent"
        data-tooltip="Agent"
        aria-label="Agent"
        {% if dock_section == 'agent' %}aria-current="page"{% endif %}
    >
        <img class="dock-brand-icon" src="{{ url_for('static', filename='images/arrow.uturn.up.circle.svg', v='arrow-uturn-up-circle-v1.0.0-codex.1') }}" alt="">
        <span class="sidebar-dock-label" aria-hidden="true">Agent</span>
    </a>
    <a
        href="{{ url_for('cache_source', source_key='chatgpt') }}"
        class="sidebar-dock-item{% if dock_section in cache_source_keys or dock_section in llm_cache_source_keys or dock_section == 'cache' %} is-active{% endif %}"
        data-dock-section="cache"
        data-section-link="cache"
        data-tooltip="Cache"
        aria-label="Cache"
        {% if dock_section in cache_source_keys or dock_section in llm_cache_source_keys or dock_section == 'cache' %}aria-current="page"{% endif %}
    >
        <span class="icon dock-icon dock-icon-cache" aria-hidden="true"></span>
        <span class="sidebar-dock-label" aria-hidden="true">Cache</span>
    </a>
    <a
        href="{{ url_for('browser', view='text', source='all', kind='all', q='', sort='newest', session_view='1') }}"
        class="sidebar-dock-item{% if dock_section == 'local-resources' %} is-active{% endif %}"
        data-dock-section="local-resources"
        data-section-link="local-resources"
        data-tooltip="Local resources"
        aria-label="Local resources"
        {% if dock_section == 'local-resources' %}aria-current="page"{% endif %}
    >
        <span class="icon dock-icon dock-icon-local-resources" aria-hidden="true"></span>
        <span class="sidebar-dock-label" aria-hidden="true">Local resources</span>
    </a>
    <a
        href="{{ url_for('settings') }}"
        class="sidebar-dock-item{% if dock_section == 'settings' %} is-active{% endif %}"
        data-dock-section="settings"
        data-section-link="settings"
        data-tooltip="Settings"
        aria-label="Settings"
        {% if dock_section == 'settings' %}aria-current="page"{% endif %}
    >
        <span class="icon dock-icon dock-icon-settings" aria-hidden="true"></span>
        <span class="sidebar-dock-label" aria-hidden="true">Settings</span>
    </a>
</nav>
